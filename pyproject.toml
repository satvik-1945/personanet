[project]
name = "personanet"
version = "0.1.0"
description = "PersonaNet: a swappable personality head for frozen LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "tqdm>=4.66.0",
    "requests>=2.32.0",
    "peft>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personanet"]

# Map src/ layout onto import name `personanet`
[tool.hatch.build.targets.wheel.sources]
"src/personanet" = "personanet"

[tool.uv]
package = true
